# Demo walkthrough for Manuals Expert Bot.
title: Manuals Expert Bot — try it
steps:
  - id: setup
    title: Finish /setup
    note: Stub model, no LLM key (demo mode). No tool credentials on this bot.
  - id: clock
    title: Ask the time
    prompt: What time is it?
  - id: search
    title: Look up a descale step
    prompt: How do I descale the Maple Espresso E-20?
  - id: jam
    title: Look up a paper jam
    prompt: The STAR RP-100 jammed. What do I do?
  - id: manuals_page
    title: Sign in and open the Manuals page
    note: /r/manuals-expert/ shows the Demo mode label (no AI key) and the demo manuals. Logged out, /r/manuals-expert/search is 401.
  - id: not_found
    title: Ask something the manuals do not cover
    prompt: What is the warranty period?
    note: The answer is "Not in your manuals".
  - id: upload
    title: Add your own manual
    note: Upload a .md or .pdf on the Manuals page (or docker cp into /data/manuals-expert/). The demo manuals drop out of results.
  - id: web
    title: Web browse is refused
    prompt: Search the web for a newer espresso manual and scrape it.
  - id: admin_404
    title: Bot admin cannot see GVS screens
    note: /gvs/role and /gvs/activity return 404.
  - id: mcp
    title: MCP read only lists search_manuals
    note: MCP is off until enabled. In read only, tools/list includes ask, search, list_items, and search_manuals.
