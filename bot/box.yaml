# Manuals Expert in a Box: generated by `new-box manuals-expert`, then customized.
# Image: <ns>/manuals-expert-in-a-box. Validate: make lint-box BOX=manuals-expert
# Role tool: search_manuals (boxes/manuals-expert/tools/search.py) + REST
# GET /r/manuals-expert/search (architecture §16.4). Web browsing is not allowed.
name: Manuals Expert in a Box
slug: manuals-expert
version: 0.1.0
core: "0.1"
role: role.md
skills: skills/
tools_allowed:
  - clock.now
  - search_manuals
tools: tools/
services: services/
connectors: {}
wizard: []
theme: theme.yaml
demo: demo/scenario.yaml
memory: { history_turns: 20, facts: true, retention_days: 30 }
mcp: { expose: [ask, search, list_items, search_manuals] }
cost: { runs: "10 chats/day", turns_per_chat: 4 }
