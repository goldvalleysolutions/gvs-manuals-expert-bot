# Manuals Expert Bot: generated by `make new-bot SLUG=manuals-expert`, then customized.
# Image: goldvalleysolutions/manuals-expert-bot (Docker Hub; docker build -f bot/Dockerfile .). Validate: make lint-bot BOT=<this repo>/bot (in gvs-core-bot)
# Role tool: search_manuals (bot/tools/search.py) + signed-in pages under /r/manuals-expert/
# (search, manuals page with upload). Demo manuals: demo/manuals/. Web browsing is not allowed.
name: Manuals Expert Bot
slug: manuals-expert
version: 0.1.0
core: "0.3"
role: role.md
skills: skills/
tools_allowed:
  - clock.now
  - search_manuals
tools: tools/
services: services/
connectors: {}
wizard: []
admin_panels: [admin/manuals.yaml]
theme: theme.yaml
demo: demo/scenario.yaml
memory: { history_turns: 20, facts: true, retention_days: 30 }
mcp: { expose: [ask, search, list_items, search_manuals] }
cost: { runs: "10 chats/day", turns_per_chat: 4 }
