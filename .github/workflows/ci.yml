name: CI

on:
  push:
    branches: [main, test]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, test]
    types: [ready_for_review, synchronize, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CORE: "0.2"
  IMAGE: ghcr.io/goldvalleysolutions/manuals-expert-bot:ci

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push'
      || (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
      || (github.event.action != 'labeled'
          && (github.event.pull_request.draft == false
              || contains(github.event.pull_request.labels.*.name, 'run-ci')))
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint bot.yaml
        run: make lint-bot

  build:
    name: build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'push'
      || (github.event.action == 'labeled' && github.event.label.name == 'run-ci')
      || (github.event.action != 'labeled'
          && (github.event.pull_request.draft == false
              || contains(github.event.pull_request.labels.*.name, 'run-ci')))
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            CORE=${{ env.CORE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Stub walkthrough
        run: make steps IMAGE=${{ env.IMAGE }}
